name: Predict with PyTorch model on CSV data
description: Makes predictions using a trained PyTorch model.
metadata:
  annotations: {author: Alexey Volkov <alexey.volkov@ark-kun.com>, canonical_location: 'https://raw.githubusercontent.com/Ark-kun/pipeline_components/master/components/PyTorch/Predict/on_CSV/component.yaml',
    python_dependencies_time: '2025-11-30'}
inputs:
- {name: data, type: CSV, description: Feature data in CSV format.}
- {name: model, type: PyTorchScriptModule, description: Trained model in binary PyTorchScriptModule
    format.}
- {name: label_column_name, type: String, description: Optional. Name of the column
    containing the label data that is excluded during the prediction., optional: true}
- {name: prediction_column_name, type: String, default: prediction, optional: true}
- {name: batch_size, type: Integer, default: '100', optional: true}
outputs:
- {name: predictions, type: CSV, description: Model predictions.}
implementation:
  container:
    image: pytorch/pytorch:1.7.1-cuda11.0-cudnn8-runtime
    command:
    - sh
    - -c
    - (PIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install --quiet --no-warn-script-location
      'pandas==2.0.3' 'numpy==1.24.4' || PIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m
      pip install --quiet --no-warn-script-location 'pandas==2.0.3' 'numpy==1.24.4'
      --user) && "$0" "$@"
    - sh
    - -ec
    - |
      program_path=$(mktemp)
      printf "%s" "$0" > "$program_path"
      python3 -u "$program_path" "$@"
    - |
      def _make_parent_dirs_and_return_path(file_path: str):
          import os

          os.makedirs(os.path.dirname(file_path), exist_ok=True)
          return file_path

      def predict_with_PyTorch_model_on_CSV_data(
          data_path,
          model_path,
          predictions_path,
          label_column_name = None,
          prediction_column_name = "prediction",
          batch_size = 100,
      ):
          """Makes predictions using a trained PyTorch model.

          Args:
              data_path: Feature data in CSV format.
              model_path: Trained model in binary PyTorchScriptModule format.
              predictions_path: Model predictions.
              label_column_name: Optional. Name of the column containing the label data that is excluded during the prediction.
          """
          from pathlib import Path

          import numpy
          import pandas
          import torch

          model = torch.jit.load(model_path)
          # Switch the model to evaluation mode
          model.eval()

          device = torch.device("cuda" if torch.cuda.is_available() else "cpu")
          print(f"{torch.cuda.is_available()=}")
          print(f"{device=}")
          model.to(device)

          df = pandas.read_csv(
              data_path,
          ).convert_dtypes()
          print("Evaluation data information:")
          df.info(verbose=True)

          if label_column_name is not None:
              features_df = df.drop(columns=[label_column_name])
          else:
              features_df = df

          # TODO: Batch processing
          features_numpy = features_df.to_numpy(dtype=numpy.float32)
          features_tensor = torch.tensor(features_numpy).to(device)
          print(f"{features_tensor.shape=}")
          predictions_tensor = model(features_tensor)
          predictions = predictions_tensor.cpu().detach().numpy()

          # Insert predictions column first
          df.insert(loc=0, column=prediction_column_name, value=predictions)

          Path(predictions_path).parent.mkdir(parents=True, exist_ok=True)
          df.to_csv(predictions_path, index=False)

      import argparse
      _parser = argparse.ArgumentParser(prog='Predict with PyTorch model on CSV data', description='Makes predictions using a trained PyTorch model.')
      _parser.add_argument("--data", dest="data_path", type=str, required=True, default=argparse.SUPPRESS)
      _parser.add_argument("--model", dest="model_path", type=str, required=True, default=argparse.SUPPRESS)
      _parser.add_argument("--label-column-name", dest="label_column_name", type=str, required=False, default=argparse.SUPPRESS)
      _parser.add_argument("--prediction-column-name", dest="prediction_column_name", type=str, required=False, default=argparse.SUPPRESS)
      _parser.add_argument("--batch-size", dest="batch_size", type=int, required=False, default=argparse.SUPPRESS)
      _parser.add_argument("--predictions", dest="predictions_path", type=_make_parent_dirs_and_return_path, required=True, default=argparse.SUPPRESS)
      _parsed_args = vars(_parser.parse_args())

      _outputs = predict_with_PyTorch_model_on_CSV_data(**_parsed_args)
    args:
    - --data
    - {inputPath: data}
    - --model
    - {inputPath: model}
    - if:
        cond: {isPresent: label_column_name}
        then:
        - --label-column-name
        - {inputValue: label_column_name}
    - if:
        cond: {isPresent: prediction_column_name}
        then:
        - --prediction-column-name
        - {inputValue: prediction_column_name}
    - if:
        cond: {isPresent: batch_size}
        then:
        - --batch-size
        - {inputValue: batch_size}
    - --predictions
    - {outputPath: predictions}
